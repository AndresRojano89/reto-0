{% extends "base.html" %}
{% block title %}Editar tarea{% endblock %}
{% block content %}
  <section class="edit-card panel">
    <a class="back-link" href="{{ url_for('tasks') }}">← Volver a mis tareas</a>
    <div class="eyebrow">AJUSTA LOS DETALLES</div>
    <h1>Editar tarea</h1>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="title">Título</label>
      <input id="title" name="title" maxlength="120" required value="{{ request.form.get('title', task.title) }}">
      <label for="description">Descripción <span class="optional">(opcional)</span></label>
      <textarea id="description" name="description" maxlength="2000" rows="5">{{ request.form.get('description', task.description) }}</textarea>
      <div class="form-actions">
        <a class="button button-secondary" href="{{ url_for('tasks') }}">Cancelar</a>
        <button class="button button-primary" type="submit">Guardar cambios <span aria-hidden="true">→</span></button>
      </div>
    </form>
  </section>
{% endblock %}
